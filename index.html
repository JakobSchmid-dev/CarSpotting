/* Layout: one column for the phone, a sticky score bar, collapsible brand "garages" with 2-up cards. Tap a card = +1. */
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --surface-2: #e8eae5;
  --fg: #16181a;
  --muted: #5f6663;
  --line: #d5d8d2;
  --accent: #c98a00;
  --accent-ink: #1a1405;
  --fav: #b57900;
  --ground: rgba(0,0,0,.14);
  --danger: #c0262d;
  --glass: rgba(20,24,28,.78);
  --font-display: "Saira Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101214; --surface: #191c1f; --surface-2: #22262a; --fg: #eef0ec; --muted: #9aa29e;
    --line: #2c3135; --accent: #f2b705; --accent-ink: #1a1405; --fav: #f2b705; --ground: rgba(0,0,0,.45); --danger: #ff5a5f;
    --glass: rgba(10,12,14,.82); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101214; --surface: #191c1f; --surface-2: #22262a; --fg: #eef0ec; --muted: #9aa29e;
  --line: #2c3135; --accent: #f2b705; --accent-ink: #1a1405; --fav: #f2b705; --ground: rgba(0,0,0,.45); --danger: #ff5a5f;
  --glass: rgba(10,12,14,.82); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 96px; }

header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
  margin: 0 -16px; padding: 12px 16px 10px;
  display: grid; gap: 10px;
}
.brandline { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: .02em; text-transform: uppercase; margin: 0; line-height: 1; }
h1 small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 12px; letter-spacing: .08em; color: var(--muted); margin-top: 4px; }
.score { display: flex; gap: 14px; text-align: right; }
.score div { display: grid; }
.score b { font-family: var(--font-display); font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
.score b small { font-size: 16px; color: var(--muted); }
.score span { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.search { width: 100%; font: inherit; font-size: 16px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.search:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

details.group { margin-top: 18px; }
details.group > summary {
  list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px;
  padding: 10px 0; border-bottom: 2px solid var(--brand, var(--line));
}
details.group > summary::-webkit-details-marker { display: none; }
details.group > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chev { width: 14px; height: 14px; flex: none; transition: transform .15s; color: var(--muted); }
details[open] > summary .chev { transform: rotate(90deg); }
.gname { font-family: var(--font-display); font-weight: 800; font-size: 22px; text-transform: uppercase; letter-spacing: .03em; flex: 1; min-width: 0; }
.gstat { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.gstat b { color: var(--fg); }
.dot { width: 10px; height: 10px; border-radius: 2px; background: var(--brand); flex: none; }

details.fav > summary { border-bottom-color: var(--fav); }
details.fav .gname { color: var(--fav); }
.favhint { font-size: 13px; color: var(--muted); margin: 8px 0 0; }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
@media (min-width: 560px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: grid; }
.card.seen { border-color: var(--brand); }
.tap { all: unset; cursor: pointer; display: grid; touch-action: manipulation; }
.tap:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
.pic { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; }
.pic svg { width: 92%; height: auto; }
.pic img { width: 100%; height: 100%; object-fit: cover; }
.count {
  position: absolute; top: 6px; right: 6px; min-width: 34px; height: 34px; padding: 0 8px; border-radius: 17px;
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 20px;
  font-variant-numeric: tabular-nums; background: var(--glass); color: #fff;
}
.card.seen .count { background: var(--accent); color: var(--accent-ink); }
.card.bump .count { animation: bump .28s ease-out; }
@keyframes bump { 40% { transform: scale(1.35); } }
.meta { padding: 7px 9px 4px; min-width: 0; }
.mname { font-weight: 600; font-size: 14.5px; line-height: 1.2; overflow-wrap: anywhere; }
.msub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.tools { display: flex; justify-content: space-between; padding: 2px 4px 4px; }
.ib { all: unset; cursor: pointer; width: 34px; height: 30px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); }
.ib:focus-visible { outline: 2px solid var(--accent); }
.ib:active { background: var(--surface-2); }
.ib svg { width: 18px; height: 18px; }
.ib.on { color: var(--fav); }
.ib[disabled] { opacity: .3; pointer-events: none; }

.empty { color: var(--muted); font-size: 14px; padding: 12px 0; }

.add { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 10px; }
.add h2 { font-family: var(--font-display); font-weight: 800; font-size: 20px; text-transform: uppercase; margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.row > * { flex: 1 1 140px; min-width: 0; }
.add input, .add select { font: inherit; font-size: 16px; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.btn { font: inherit; font-weight: 600; padding: 10px 14px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.foot { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; font-size: 12px; color: var(--muted); }

.toast {
  position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--fg); color: var(--bg); border-radius: 12px; padding: 10px 12px 10px 14px;
  display: flex; gap: 14px; align-items: center; max-width: calc(100% - 32px); font-size: 14px; z-index: 10;
  box-shadow: 0 6px 24px rgba(0,0,0,.25);
}
.toast button { all: unset; cursor: pointer; font-weight: 600; color: var(--accent); padding: 4px 6px; }
.pics { position: absolute; left: 6px; bottom: 6px; display: flex; gap: 3px; align-items: center; padding: 2px 7px 2px 5px; border-radius: 10px; background: var(--glass); color: #fff; font-size: 12px; font-weight: 600; }
.pics svg { width: 13px; height: 13px; }
.tools { gap: 2px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn svg { width: 18px; height: 18px; }
.btn.sm { padding: 6px 10px; font-size: 13px; }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); width: 100%; margin-top: 18px; }
body.locked { overflow: hidden; }
.sheet { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; }
.panel { background: var(--bg); width: 100%; max-width: 640px; max-height: 92%; overflow-y: auto; border-radius: 18px 18px 0 0;
  padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0px)); }
.shead { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.shead h3 { font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 1.05; margin: 2px 0 0; text-wrap: balance; }
.sbrand { display: flex; align-items: center; gap: 6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.hero { margin-top: 12px; aspect-ratio: 16 / 10; max-width: 100%; border-radius: 12px; overflow: hidden; background: var(--surface-2); display: grid; place-items: center; }
.hero svg { width: 90%; height: auto; } .hero img { width: 100%; height: 100%; object-fit: cover; }
.counter { display: flex; align-items: center; justify-content: center; gap: 24px; margin: 14px 0; }
.counter div { display: grid; text-align: center; }
.counter b { font-family: var(--font-display); font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.counter span { font-size: 12px; color: var(--muted); }
.round { all: unset; cursor: pointer; width: 52px; height: 52px; border-radius: 26px; display: grid; place-items: center; background: var(--surface-2); color: var(--fg); }
.round.plus { background: var(--accent); color: var(--accent-ink); }
.round svg { width: 22px; height: 22px; } .round[disabled] { opacity: .3; pointer-events: none; }
.round:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.srow { display: flex; flex-wrap: wrap; gap: 8px; } .srow .btn { flex: 1 1 150px; }
.panel h4 { font-family: var(--font-display); font-size: 18px; text-transform: uppercase; letter-spacing: .03em; margin: 18px 0 8px; }
.panel h4 span { color: var(--muted); font-weight: 600; }
.photos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.photos figure { margin: 0; position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--surface-2); }
.photos img { width: 100%; height: 100%; object-fit: cover; }
.photos .del { all: unset; cursor: pointer; position: absolute; top: 6px; right: 6px; min-width: 32px; height: 32px; padding: 0 6px; border-radius: 16px; display: grid; place-items: center; background: var(--glass); color: #fff; font-size: 13px; font-weight: 600; }
.photos .del.armed { background: var(--danger); }
.photos .del svg { width: 16px; height: 16px; }
.pending { position: absolute; left: 6px; bottom: 6px; font-size: 11px; padding: 2px 6px; border-radius: 8px; background: var(--glass); color: #fff; }
.hlist { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 6px; }
.hlist li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.hlist small { color: var(--muted); }
input[type=file] { display: none; }
@media (prefers-reduced-motion: reduce) { .card.bump .count { animation: none; } .chev { transition: none; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brandline">
      <h1>Motorworld Spotting<small>SAISONABSCHLUSS · BÖBLINGEN</small></h1>
      <div class="score">
        <div><b id="sumTotal">0</b><span>Sichtungen</span></div>
        <div><b id="sumModels">0</b><span>Modelle</span></div>
      </div>
    </div>
    <input id="q" class="search" type="search" placeholder="Modell suchen, z. B. Pista, GT3, M3" autocomplete="off" aria-label="Modell suchen">
  </header>

  <main id="list"></main>

  <form class="add" id="addForm">
    <h2>Auto hinzufügen</h2>
    <div class="row">
      <select id="addBrand" aria-label="Marke"></select>
      <input id="addName" placeholder="Modell, z. B. Ferrari 360 Challenge Stradale" aria-label="Modell" required>
    </div>
    <div class="row">
      <select id="addBody" aria-label="Karosserie">
        <option value="super">Mittelmotor-Supersportler</option>
        <option value="coupe">Coupé / GT</option>
        <option value="rear">Heckmotor (911-Form)</option>
        <option value="sedan">Limousine</option>
        <option value="wagon">Kombi</option>
        <option value="suv">SUV / Geländewagen</option>
      </select>
      <button class="btn" type="submit">Hinzufügen</button>
    </div>
  </form>

  <details class="group hiddenbox" id="hiddenBox" hidden>
    <summary><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg><span class="gname">Entfernte Autos</span><span class="gstat"><b id="hiddenCount">0</b></span></summary>
    <ul class="hlist" id="hiddenList"></ul>
  </details>

  <div class="foot">
    <span id="syncState">Zähler werden auf diesem Gerät gespeichert.</span>
    <button class="btn ghost" id="resetBtn" type="button">Alle Zähler auf 0</button>
  </div>
</div>

<div class="toast" id="toast" hidden><span id="toastText"></span><button id="undoBtn" type="button">Rückgängig</button></div>
<input type="file" id="photoInput" accept="image/*" multiple>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Auto-Details">
  <div class="panel" id="sheetBody"></div>
</div>

  super: { path: "M10 60 L13 50 Q40 46 70 37 Q94 27 118 26 Q150 27 174 40 L190 46 Q195 52 193 60 Z", glass: "M80 38 Q98 30 117 30 L138 32 L148 40 Z" },
  coupe: { path: "M8 60 L10 49 Q28 43 68 41 L92 29 Q110 23 136 26 L160 38 Q186 40 192 48 L192 60 Z", glass: "M95 39 L104 30 Q116 27 132 29 L150 39 Z" },
  rear:  { path: "M8 60 L10 50 Q28 44 60 40 Q88 22 124 24 Q160 27 182 42 Q193 48 192 60 Z", glass: "M78 39 Q94 28 118 28 L140 31 L152 40 Z" },
  sedan: { path: "M8 60 L10 47 Q22 41 52 39 L72 25 Q100 21 130 24 L152 38 Q182 40 192 47 L192 60 Z", glass: "M76 38 L86 28 Q104 25 126 27 L142 38 Z" },
  wagon: { path: "M8 60 L10 47 Q22 41 52 39 L72 25 L170 24 Q179 26 186 38 L192 47 L192 60 Z", glass: "M76 38 L86 28 L166 28 L174 38 Z" },
  suv:   { path: "M8 62 L8 43 Q14 35 46 33 L66 16 L168 16 Q178 18 186 30 L192 41 L192 62 Z", glass: "M70 32 L80 20 L164 20 L172 32 Z" },
};
const WHEEL_X = { super: [48, 156], coupe: [46, 154], rear: [44, 152], sedan: [46, 156], wagon: [46, 156], suv: [46, 158] };

const ICON = {
  minus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
  starOn: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
  cam: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
};

ICON.more = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>';
ICON.plus = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg>';
ICON.close = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
ICON.trash = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';

const LS_KEY = "motorworld-spotting-v1";
const brandById = Object.fromEntries(BRANDS.map(b => [b.id, b]));
const defaultFavs = CARS.filter(c => c[5]).map(c => c[0]);
const $ = id => document.getElementById(id);

let state = { counts: {}, favs: defaultFavs.slice(), custom: [], photos: {}, hidden: [], open: {}, updatedAt: 0 };
function normalize(s) {
  s = Object.assign({ counts: {}, favs: [], custom: [], photos: {}, hidden: [], open: {}, updatedAt: 0 }, s);
  // Older versions kept one photo per car as a bare asset id.
  for (const k of Object.keys(s.photos)) {
    const v = s.photos[k];
    s.photos[k] = (Array.isArray(v) ? v : [v]).filter(Boolean).map(r => (r.startsWith("a:") || r.startsWith("l:")) ? r : "a:" + r);
    if (!s.photos[k].length) delete s.photos[k];
  }
  return s;
}
try {
  const saved = JSON.parse(localStorage.getItem(LS_KEY) || "null");
  if (saved && typeof saved === "object") state = normalize(Object.assign(state, saved));
} catch (e) {}

let userDoc = null, assets = null;

function allCars() {
  const base = CARS.map(([id, brand, name, sub, body]) => ({ id, brand, name, sub, body }));
  return base.concat((state.custom || []).map(c => Object.assign({ sub: "Eigener Eintrag" }, c)));
}
function visibleCars() { return allCars().filter(c => !state.hidden.includes(c.id)); }
function carById(id) { return allCars().find(c => c.id === id); }
function esc(s) { return String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]); }

// ---------- photos: uploaded to the artifact when possible, kept on the phone (IndexedDB) otherwise ----------
let idbP = null;
function idb() {
  if (!idbP) idbP = new Promise((res, rej) => {
    const r = indexedDB.open("motorworld-photos", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("p");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return idbP;
}
async function idbDo(mode, fn) {
  const d = await idb();
  return new Promise((res, rej) => {
    const tx = d.transaction("p", mode);
    const req = fn(tx.objectStore("p"));
    tx.oncomplete = () => res(req && req.result);
    tx.onerror = () => rej(tx.error);
  });
}
const localUrls = {};
async function localUrl(key) {
  if (localUrls[key]) return localUrls[key];
  const blob = await idbDo("readonly", s => s.get(key));
  if (!blob) return "";
  return (localUrls[key] = URL.createObjectURL(blob));
}
function photoImg(ref, cls) {
  if (ref.startsWith("a:")) return `<img class="${cls || ""}" src="/_blob/${esc(ref.slice(2))}" alt="" loading="lazy">`;
  return `<img class="${cls || ""}" data-local="${esc(ref.slice(2))}" alt="">`;
}
function hydrateLocal(root) {
  root.querySelectorAll("img[data-local]").forEach(async img => {
    try { const u = await localUrl(img.dataset.local); if (u) img.src = u; } catch (e) {}
  });
}

function shrink(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1400 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error("encode")), "image/jpeg", 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("load")); };
    img.src = url;
  });
}
async function storePhoto(blob) {
  if (assets) {
    try { const r = await assets.upload(blob, { type: "image/jpeg" }); return { ref: "a:" + r.id, online: true }; } catch (e) {}
  }
  const key = "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  await idbDo("readwrite", s => s.put(blob, key));
  return { ref: "l:" + key, online: false };
}
async function addPhotos(id, files) {
  const list = [...files].filter(f => f && (f.type || "").startsWith("image/") || /\.(heic|heif|jpe?g|png|webp)$/i.test(f.name || ""));
  if (!list.length) return;
  toast(list.length > 1 ? `${list.length} Fotos werden gespeichert …` : "Foto wird gespeichert …");
  let ok = 0, offline = 0;
  for (const f of list) {
    try {
      const blob = await shrink(f);
      const { ref, online } = await storePhoto(blob);
      state.photos[id] = (state.photos[id] || []).concat(ref);
      ok++; if (!online) offline++;
    } catch (e) {}
  }
  if (!ok) { toast("Das Foto konnte nicht gelesen werden. Versuch ein anderes Bild."); return; }
  persist();
  updateCard(id);
  if (sheetId === id) renderSheet();
  toast(offline ? `${ok} Foto${ok > 1 ? "s" : ""} auf dem Handy gespeichert, Upload folgt bei Netz` : `${ok} Foto${ok > 1 ? "s" : ""} gespeichert`);
}
let syncingLocal = false;
async function uploadLocalPhotos() {
  if (!assets || syncingLocal) return;
  syncingLocal = true;
  let changed = false;
  try {
    for (const [id, refs] of Object.entries(state.photos)) {
      for (let i = 0; i < refs.length; i++) {
        if (!refs[i].startsWith("l:")) continue;
        const key = refs[i].slice(2);
        try {
          const blob = await idbDo("readonly", s => s.get(key));
          if (!blob) continue;
          const r = await assets.upload(blob, { type: "image/jpeg" });
          refs[i] = "a:" + r.id;
          changed = true;
          idbDo("readwrite", s => s.delete(key)).catch(() => {});
        } catch (e) { syncingLocal = false; if (changed) { persist(); render(); } return; }
      }
    }
  } finally { syncingLocal = false; }
  if (changed) { persist(); render(); if (sheetId) renderSheet(); }
}

// ---------- rendering ----------
function carSvg(car) {
  const b = BODIES[car.body] || BODIES.coupe;
  const col = brandById[car.brand]?.color || "#888";
  const [w1, w2] = WHEEL_X[car.body] || WHEEL_X.coupe;
  const gid = "g-" + car.id + "-" + Math.random().toString(36).slice(2, 6);
  const wheel = x => `<circle cx="${x}" cy="60" r="12.5" fill="#111"/><circle cx="${x}" cy="60" r="6.5" fill="#9aa0a4"/><circle cx="${x}" cy="60" r="2" fill="#111"/>`;
  return `<svg viewBox="0 0 200 80" aria-hidden="true">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity="1"/><stop offset="1" stop-color="${col}" stop-opacity=".72"/></linearGradient></defs>
    <ellipse cx="100" cy="72" rx="92" ry="4" fill="var(--ground)"/>
    <path d="${b.path}" fill="url(#${gid})"/>
    <path d="${b.glass}" fill="#0c0f12" opacity=".78"/>
    <path d="M14 52 L186 52" stroke="#000" stroke-opacity=".18" stroke-width="1.2"/>
    ${wheel(w1)}${wheel(w2)}
  </svg>`;
}
function coverHtml(car) {
  const refs = state.photos[car.id] || [];
  return refs.length ? photoImg(refs[refs.length - 1]) : carSvg(car);
}

function cardHtml(car) {
  const n = state.counts[car.id] || 0;
  const fav = state.favs.includes(car.id);
  const col = brandById[car.brand]?.color || "#888";
  const pics = (state.photos[car.id] || []).length;
  return `<div class="card${n ? " seen" : ""}" data-id="${esc(car.id)}" style="--brand:${col}">
    <button class="tap" type="button" data-act="inc" aria-label="${esc(car.name)} gesehen, jetzt ${n}">
      <div class="pic">${coverHtml(car)}<span class="count">${n}</span>${pics ? `<span class="pics">${ICON.cam}${pics}</span>` : ""}</div>
      <div class="meta"><div class="mname">${esc(car.name)}</div>${car.sub ? `<div class="msub">${esc(car.sub)}</div>` : ""}</div>
    </button>
    <div class="tools">
      <button class="ib" type="button" data-act="dec" aria-label="Eins abziehen"${n ? "" : " disabled"}>${ICON.minus}</button>
      <button class="ib" type="button" data-act="photo" aria-label="Foto hinzufügen">${ICON.cam}</button>
      <button class="ib${fav ? " on" : ""}" type="button" data-act="fav" aria-label="${fav ? "Aus Favoriten entfernen" : "Zu Favoriten"}">${fav ? ICON.starOn : ICON.star}</button>
      <button class="ib" type="button" data-act="open" aria-label="Details, Fotos und Entfernen">${ICON.more}</button>
    </div>
  </div>`;
}

function groupHtml(key, title, cars, opts) {
  const seenModels = cars.filter(c => state.counts[c.id]).length;
  const total = cars.reduce((s, c) => s + (state.counts[c.id] || 0), 0);
  const isOpen = $("q").value.trim() ? true : (state.open[key] ?? opts.defaultOpen);
  return `<details class="group${opts.cls ? " " + opts.cls : ""}" data-key="${key}" style="--brand:${opts.color || "var(--line)"}"${isOpen ? " open" : ""}>
    <summary>${ICON.chev}${opts.cls === "fav" ? "" : '<span class="dot"></span>'}<span class="gname">${esc(title)}</span>
      <span class="gstat"><b>${seenModels}</b>/${cars.length} · <b>${total}</b>×</span></summary>
    ${opts.hint ? `<p class="favhint">${opts.hint}</p>` : ""}
    ${cars.length ? `<div class="grid">${cars.map(cardHtml).join("")}</div>` : `<p class="empty">${opts.empty || "Keine Treffer."}</p>`}
  </details>`;
}

function updateSummary() {
  const cars = visibleCars();
  $("sumTotal").textContent = cars.reduce((s, c) => s + (state.counts[c.id] || 0), 0);
  $("sumModels").innerHTML = cars.filter(c => state.counts[c.id]).length + "<small>/" + cars.length + "</small>";
}

function render() {
  const q = $("q").value.trim().toLowerCase();
  const cars = visibleCars();
  const match = c => !q || (c.name + " " + c.sub + " " + (brandById[c.brand]?.name || "")).toLowerCase().includes(q);
  const favCars = state.favs.map(id => cars.find(c => c.id === id)).filter(Boolean).filter(match);
  let html = groupHtml("fav", "Favoriten · Die großen Ziele", favCars, {
    cls: "fav", defaultOpen: true,
    hint: q ? "" : "Tipp aufs Bild zählt +1. Stern = Favorit, Kamera = Foto, ⋯ = Fotos ansehen oder Auto entfernen.",
    empty: q ? "Kein Favorit passt zur Suche." : "Noch keine Favoriten. Tippe bei einem Auto auf den Stern.",
  });
  for (const b of BRANDS) {
    const list = cars.filter(c => c.brand === b.id && match(c));
    if (q && !list.length) continue;
    html += groupHtml(b.id, b.name, list, { color: b.color, defaultOpen: true, empty: "Alle Autos dieser Marke sind entfernt." });
  }
  $("list").innerHTML = html;
  hydrateLocal($("list"));
  updateSummary();
  renderHidden();
}

function renderHidden() {
  const hidden = state.hidden.map(carById).filter(Boolean);
  const box = $("hiddenBox");
  box.hidden = !hidden.length;
  $("hiddenCount").textContent = hidden.length;
  $("hiddenList").innerHTML = hidden.map(c => `<li><span>${esc(c.name)} <small>${esc(brandById[c.brand]?.name || "")}</small></span>
    <button class="btn ghost sm" type="button" data-restore="${esc(c.id)}">Zurückholen</button></li>`).join("");
}

function updateCard(id) {
  // A car can appear twice (Favoriten and its brand), so refresh every copy without a full re-render.
  const car = carById(id);
  document.querySelectorAll(`.card[data-id="${CSS.escape(id)}"]`).forEach(el => {
    const tmp = document.createElement("div");
    tmp.innerHTML = cardHtml(car);
    const fresh = tmp.firstElementChild;
    el.replaceWith(fresh);
    fresh.classList.add("bump");
    hydrateLocal(fresh);
  });
  updateSummary();
  $("list").querySelectorAll("details.group").forEach(d => {
    const ids = [...d.querySelectorAll(".card")].map(c => c.dataset.id);
    const g = d.querySelector(".gstat");
    if (g) g.innerHTML = `<b>${ids.filter(i => state.counts[i]).length}</b>/${ids.length} · <b>${ids.reduce((s, i) => s + (state.counts[i] || 0), 0)}</b>×`;
  });
}

// ---------- detail sheet ----------
let sheetId = null, armed = null, armTimer = null;
function arm(key) {
  armed = key; clearTimeout(armTimer);
  armTimer = setTimeout(() => { armed = null; if (sheetId) renderSheet(); }, 4000);
}
function openSheet(id) { sheetId = id; armed = null; renderSheet(); $("sheet").hidden = false; document.body.classList.add("locked"); }
function closeSheet() { sheetId = null; $("sheet").hidden = true; document.body.classList.remove("locked"); }
function renderSheet() {
  const car = carById(sheetId);
  if (!car) return closeSheet();
  const n = state.counts[car.id] || 0;
  const fav = state.favs.includes(car.id);
  const refs = state.photos[car.id] || [];
  const col = brandById[car.brand]?.color || "#888";
  $("sheetBody").innerHTML = `
    <div class="shead" style="--brand:${col}">
      <div><div class="sbrand"><span class="dot"></span>${esc(brandById[car.brand]?.name || "")}</div><h3>${esc(car.name)}</h3>${car.sub ? `<div class="msub">${esc(car.sub)}</div>` : ""}</div>
      <button class="ib" type="button" data-s="close" aria-label="Schließen">${ICON.close}</button>
    </div>
    <div class="hero">${coverHtml(car)}</div>
    <div class="counter">
      <button class="round" type="button" data-s="dec" aria-label="Eins abziehen"${n ? "" : " disabled"}>${ICON.minus}</button>
      <div><b>${n}</b><span>× gesehen</span></div>
      <button class="round plus" type="button" data-s="inc" aria-label="Eins dazu">${ICON.plus}</button>
    </div>
    <div class="srow">
      <button class="btn" type="button" data-s="photo">${ICON.cam} Fotos hinzufügen</button>
      <button class="btn ghost" type="button" data-s="fav">${fav ? ICON.starOn + " Favorit" : ICON.star + " Zu Favoriten"}</button>
    </div>
    <h4>Deine Fotos <span>${refs.length}</span></h4>
    ${refs.length ? `<div class="photos">${refs.slice().reverse().map(r => `
      <figure>${photoImg(r)}${r.startsWith("l:") ? '<span class="pending">Nur auf dem Handy</span>' : ""}
        <button class="del${armed === "del:" + r ? " armed" : ""}" type="button" data-s="del" data-ref="${esc(r)}" aria-label="Foto löschen">${armed === "del:" + r ? "Löschen?" : ICON.trash}</button></figure>`).join("")}</div>`
      : `<p class="empty">Noch keine Fotos. Mach ein Bild mit deiner Kamera und füge es hier hinzu. Du kannst mehrere auf einmal auswählen.</p>`}
    <button class="btn danger" type="button" data-s="remove">${ICON.trash} ${armed === "remove" ? "Wirklich entfernen? Nochmal tippen" : "Auto aus der Liste entfernen"}</button>`;
  hydrateLocal($("sheetBody"));
}
$("sheet").addEventListener("click", e => {
  if (e.target.id === "sheet") return closeSheet();
  const b = e.target.closest("[data-s]");
  if (!b || !sheetId) return;
  const id = sheetId, car = carById(id), prev = state.counts[id] || 0;
  switch (b.dataset.s) {
    case "close": closeSheet(); break;
    case "inc": setCount(id, prev + 1); renderSheet(); break;
    case "dec": if (prev) { setCount(id, prev - 1); renderSheet(); } break;
    case "photo": pickPhotos(id); break;
    case "fav": toggleFav(id); renderSheet(); break;
    case "del": {
      const ref = b.dataset.ref;
      if (armed !== "del:" + ref) { arm("del:" + ref); renderSheet(); break; }
      armed = null;
      state.photos[id] = (state.photos[id] || []).filter(r => r !== ref);
      if (!state.photos[id].length) delete state.photos[id];
      if (ref.startsWith("l:")) idbDo("readwrite", s => s.delete(ref.slice(2))).catch(() => {});
      else if (assets) assets.delete(ref.slice(2)).catch(() => {});
      persist(); updateCard(id); renderSheet(); toast("Foto gelöscht");
      break;
    }
    case "remove":
      if (armed !== "remove") { arm("remove"); renderSheet(); break; }
      closeSheet(); removeCar(id); break;
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && sheetId) closeSheet(); });

// ---------- persistence: this device first, then the account (when available) ----------
let saveTimer = null, writing = false, dirty = false;
function persist() {
  state.updatedAt = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
  dirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushRemote, 700);
}
async function pushRemote() {
  if (!userDoc || writing || !dirty) return;
  writing = true; dirty = false;
  try {
    await userDoc.set(JSON.parse(JSON.stringify(state)));
    setSync("Gespeichert in deinem Konto und auf diesem Gerät.");
  } catch (e) {
    dirty = true;
    setSync("Offline gespeichert. Wird synchronisiert, sobald wieder Netz da ist.");
  } finally {
    writing = false;
    if (dirty) { clearTimeout(saveTimer); saveTimer = setTimeout(pushRemote, 4000); }
  }
}
function setSync(t) { $("syncState").textContent = t; }
window.addEventListener("online", () => { dirty = true; pushRemote(); uploadLocalPhotos(); });

async function connect() {
  if (!window.claude?.use) return;
  try {
    const [dbNs, userNs] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    const uid = dbNs && userNs ? await userNs.id() : null;
    if (uid) {
      userDoc = dbNs.doc("data/users/" + uid + "/spotting/state");
      const snap = await userDoc.get();
      const remote = snap.exists ? snap.data() : null;
      if (remote && (remote.updatedAt || 0) > (state.updatedAt || 0)) {
        state = normalize(remote);
        try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
        render();
      } else if (state.updatedAt) {
        dirty = true; pushRemote();
      }
      setSync("Gespeichert in deinem Konto und auf diesem Gerät.");
    }
  } catch (e) {}
  try { assets = await window.claude.use("assets"); } catch (e) {}
  uploadLocalPhotos();
}

// ---------- actions ----------
let lastAction = null, toastTimer = null;
function toast(text, undo) {
  lastAction = undo || null;
  $("toastText").textContent = text;
  $("undoBtn").hidden = !undo;
  $("toast").hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $("toast").hidden = true; lastAction = null; }, 4000);
}
$("undoBtn").addEventListener("click", () => {
  if (lastAction) { lastAction(); lastAction = null; }
  $("toast").hidden = true;
});

function setCount(id, n) {
  if (n > 0) state.counts[id] = n; else delete state.counts[id];
  persist();
  updateCard(id);
}
function toggleFav(id) {
  const car = carById(id), was = state.favs.includes(id);
  state.favs = was ? state.favs.filter(f => f !== id) : state.favs.concat(id);
  persist(); render();
  toast(was ? `${car.name} aus Favoriten entfernt` : `${car.name} ist jetzt Favorit`);
}
function removeCar(id) {
  const car = carById(id);
  const wasFav = state.favs.includes(id);
  state.hidden = state.hidden.filter(h => h !== id).concat(id);
  state.favs = state.favs.filter(f => f !== id);
  persist(); render();
  toast(`${car.name} entfernt`, () => {
    state.hidden = state.hidden.filter(h => h !== id);
    if (wasFav) state.favs = state.favs.concat(id);
    persist(); render();
  });
}

let photoFor = null;
function pickPhotos(id) { photoFor = id; $("photoInput").click(); }
$("photoInput").addEventListener("change", e => {
  const files = e.target.files ? [...e.target.files] : [];
  e.target.value = "";
  if (photoFor && files.length) addPhotos(photoFor, files);
});

$("list").addEventListener("click", e => {
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const id = btn.closest(".card").dataset.id;
  const car = carById(id);
  const prev = state.counts[id] || 0;
  switch (btn.dataset.act) {
    case "inc":
      setCount(id, prev + 1);
      try { navigator.vibrate && navigator.vibrate(18); } catch (err) {}
      toast(`${car.name}: ${prev + 1}× gesehen`, () => setCount(id, prev));
      break;
    case "dec":
      if (prev) { setCount(id, prev - 1); toast(`${car.name}: ${prev - 1}×`, () => setCount(id, prev)); }
      break;
    case "fav": toggleFav(id); break;
    case "photo": pickPhotos(id); break;
    case "open": openSheet(id); break;
  }
});

$("hiddenList").addEventListener("click", e => {
  const b = e.target.closest("[data-restore]");
  if (!b) return;
  state.hidden = state.hidden.filter(h => h !== b.dataset.restore);
  persist(); render();
  toast(`${carById(b.dataset.restore).name} ist wieder in der Liste`);
});

$("list").addEventListener("toggle", e => {
  const d = e.target;
  if (!d.matches || !d.matches("details.group") || $("q").value) return;
  state.open[d.dataset.key] = d.open;
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (err) {}
}, true);

$("q").addEventListener("input", render);

$("addBrand").innerHTML = BRANDS.map(b => `<option value="${b.id}">${esc(b.name)}</option>`).join("");
$("addForm").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("addName").value.trim();
  if (!name) return;
  const car = { id: "c-" + Date.now().toString(36), brand: $("addBrand").value, name, body: $("addBody").value };
  state.custom = (state.custom || []).concat(car);
  persist();
  $("addName").value = "";
  render();
  toast(`${name} hinzugefügt`);
});

let resetArmed = false, resetTimer = null;
$("resetBtn").addEventListener("click", e => {
  const btn = e.currentTarget;
  if (!resetArmed) {
    resetArmed = true; btn.textContent = "Wirklich alles auf 0? Nochmal tippen";
    resetTimer = setTimeout(() => { resetArmed = false; btn.textContent = "Alle Zähler auf 0"; }, 4000);
    return;
  }
  clearTimeout(resetTimer); resetArmed = false; btn.textContent = "Alle Zähler auf 0";
  const before = Object.assign({}, state.counts);
  state.counts = {};
  persist(); render();
  toast("Alle Zähler zurückgesetzt", () => { state.counts = before; persist(); render(); });
});

render();
connect();
})();
</script>
